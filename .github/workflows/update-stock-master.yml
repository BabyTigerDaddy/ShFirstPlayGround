name: update-stock-master

# 매일 새벽 KRX 상장법인목록을 받아 holding-note-app 브랜치의 stock_master.json을 갱신.
# 목록이 실제로 바뀐 날만 커밋 -> 앱은 그날만 새로 받음.
# (cron은 default 브랜치에서만 도는 GitHub 정책이라 workflow는 main에 두고 대상만 holding-note-app.)

on:
  schedule:
    - cron: '0 20 * * *'   # UTC 20:00 = KST 05:00
  workflow_dispatch:        # 수동 실행

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: holding-note-app

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build stock master
        run: python scripts/build_stock_master.py

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain stock_master.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add stock_master.json
            git commit -m "chore: 종목 목록 자동 갱신 (KRX KIND)"
            git push origin HEAD:holding-note-app
          else
            echo "no change, skip commit"
          fi
